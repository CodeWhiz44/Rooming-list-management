version: "3.8"

services:
    db:
        image: postgres:15
        restart: always
        env_file: ./backend/.env
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 5s
            retries: 5
        command: postgres -c listen_addresses='*'
        logging:
            options:
                max-size: "10m"
                max-file: "3"

    backend:
        build: ./backend
        depends_on:
            db:
                condition: service_healthy
        env_file: ./backend/.env
        ports:
            - "5001:5001"
        volumes:
            - ./backend/src:/app/src
            - ./backend/prisma:/app/prisma
        command: ["npm", "run", "dev"]

    backend-test:
        build: ./backend
        env_file: ./backend/.env
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - ./backend/src:/app/src
            - ./backend/prisma:/app/prisma
        command: ["npm", "run", "test"]
    frontend:
        build: ./frontend
        env_file: ./frontend/.env
        depends_on:
            - backend
        ports:
            - "5173:5173"
        volumes:
            - ./frontend:/app
            - /app/node_modules
        command: ["npm", "run", "dev"]

volumes:
    db_data:
